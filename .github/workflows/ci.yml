name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The schema-drift job compares this repo against another one, so it can go
  # from green to red with nothing here changing. A daily run is what turns
  # that from "discovered by hand, a day late" into a notification.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

  # Build tuning that applies to CI only. Deliberately env vars here rather
  # than a `[profile.*]` block in Cargo.toml: the cost being paid is specific
  # to a runner, and putting it in Cargo.toml would silently strip debug info
  # from every contributor's local builds to fix a problem they do not have.
  #
  # Incremental compilation is pure overhead on a runner. Its state is never
  # reused across runs -- each starts from a restored dependency cache at
  # best -- so it only writes artifacts nothing reads, while inflating
  # `target/`, which this workflow has repeatedly run out of (see `check`'s
  # disk-freeing and `cargo clean` steps).
  CARGO_INCREMENTAL: 0
  # `line-tables-only` rather than `0`: full debug info across this
  # workspace's 131 integration-test binaries is a large share of both link
  # time and `target/` size, but dropping it entirely would leave a CI panic
  # with a backtrace and no line numbers -- and a CI log is the one place a
  # backtrace has to be readable without attaching a debugger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Cheap and independent of the Rust toolchain, so it reports in seconds
  # rather than behind a 15-minute build.
  schema-drift:
    name: schema version vs. remind_me
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `remind_me` is public, so this needs no token. It clones inside the
      # script rather than using a second actions/checkout so the same command
      # works locally, where there is no Actions context to borrow.
      - name: Compare SCHEMA_VERSION against the reference
        run: scripts/check_schema_drift.sh

      # A passing check above only means the version *number* hasn't fallen
      # behind -- it says nothing about whether schema_tables.sql,
      # schema_indexes.sql and schema_triggers.sql (generated verbatim by
      # regenerate_schema.py; their headers say "do not hand-edit") actually
      # match what the generator produces. A hand-edit to one of those files
      # that didn't match the generator's output passed CI silently as long
      # as SCHEMA_VERSION itself was untouched (#277). This regenerates them
      # into a scratch dir and diffs against what's committed, same
      # clone-inside-the-script convention as the step above.
      - name: Regenerate schema_*.sql and diff against committed files
        run: scripts/check_schema_regen_drift.sh

  # Also cheap and toolchain-independent -- catches a version bump that
  # updated Cargo.toml but forgot .claude-plugin/plugin.json (or vice versa)
  # before it ever reaches the release workflow, which tags and packages
  # both from the same PR.
  plugin-version:
    name: plugin.json version vs. workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare .claude-plugin/plugin.json against Cargo.toml
        run: scripts/check_plugin_version.sh

  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml is the source of truth for the compiler and its
        # components, so CI and a developer's machine lint identically. Before
        # this, CI took whatever `stable` was that day and a developer took
        # whatever they had installed; the gap was invisible until CI failed on
        # a lint the local toolchain did not have (#213).
        run: rustup toolchain install

      # Swatinem/rust-cache rather than actions/cache over `target/`, measured
      # rather than assumed: on run 31951918373 the `combined-features` job
      # spent 4m49s restoring and 6m59s saving a cache to avoid 5m44s of
      # compilation -- 66% of its wall clock moving a cache that cost more
      # than it saved. `windows` spent 6m40s of 16m42s the same way, and this
      # job's own restore was a 5-second miss, which is what several multi-GB
      # caches evicting each other against the repository's 10GB cache budget
      # looks like.
      #
      # This action caches the registry and *dependency* artifacts only,
      # pruning the workspace's own crates (rebuilt every run regardless) and
      # stale entries. Far smaller, so far faster, and small enough that the
      # caches here stop fighting each other.
      #
      # Must run after the toolchain install: the cache key includes the rustc
      # version, which it reads from the installed toolchain.
      - name: Cache cargo registry and dependency build output
        uses: Swatinem/rust-cache@v2
        with:
          key: check

      # Formatting first: it is the cheapest gate and needs no compilation.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # --all-targets so tests and benches are linted too, not just lib/bin.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Optional features are off by default, so `check` above never compiles
  # them. Without this, a feature could rot untested and only break for
  # whoever actually enabled it.
  #
  # One runner per feature, in parallel, rather than the ~10 sequential steps
  # this used to be inside `check`. The work is identical; only the wall clock
  # changes -- from the sum of every feature's build to the slowest single one
  # (`ann`, whose usearch C++ build dominates).
  #
  # This is also what removed `check`'s "Free disk space" step and its three
  # `cargo clean` steps. All four existed because consecutive feature steps
  # relinked every integration test binary in remind_me_core/remind_me_hub
  # against a new feature set, and the accumulated dead binaries exhausted the
  # runner's disk mid-link -- an ENOSPC during `ann`'s link, and an `ld` SIGBUS
  # during `local-embed`'s. One feature per runner means nothing accumulates,
  # so there is nothing to reclaim. If `check` ever hits ENOSPC again,
  # restoring a disk-freeing step there is the fix: it was dropped because its
  # cause moved, not because runners grew.
  #
  # `test` and `clippy` are per-feature flags rather than both running
  # everywhere, preserving exactly what each feature was verified with before.
  # That mapping is deliberate and load-bearing:
  #
  #   - `ocr`/`audio` are clippy-only because neither can do its actual job
  #     without a model, and downloading one in CI is precisely the implicit
  #     fetch these features are required never to perform. Everything that
  #     *is* checkable without a model -- the feature-off refusals, the
  #     model-configuration errors, the audio decode/resample arithmetic --
  #     runs unconditionally in `check`.
  #   - `ann` runs its tests because the equivalence check (that narrowing
  #     never drops a row brute force would rank) is the whole reason the
  #     feature is safe to enable, and it has to actually run somewhere.
  #   - `rerank` runs its tests because they assert something a build check
  #     cannot: that compiling the reranker in does *not* turn a search into a
  #     model download, and that a configured-but-unloadable model still
  #     degrades to RRF order.
  #   - `stack-dumps` runs its tests because the feature's entire claim is that
  #     a thread wedged in CPU-bound code still gets dumped. Only running it can
  #     show that; a compile check would pass against a build that dumps
  #     nothing.
  #   - `local-embed` is clippy-only for a reason that no longer applies: per
  #     the step comment this replaces, it was *not* because it needs a model
  #     (it does not -- onnx_embedder_test.rs covers the graceful-degradation
  #     paths with synthetic files) but because `cargo test` relinking every
  #     integration test binary against rten/tokenizers exhausted the shared
  #     runner's disk mid-link. A dedicated runner removes that constraint, so
  #     this could become `test: true` and gain real coverage. Left as-is on
  #     purpose: this change is about how long CI takes, and quietly widening
  #     what is verified inside it would make a speed change and a coverage
  #     change indistinguishable in the history.
  features:
    name: feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      # One feature failing should not cancel the others: which *set* of
      # features broke is the useful signal, and fail-fast reports one.
      fail-fast: false
      matrix:
        include:
          - feature: pdf
            test: true
            clippy: true
          - feature: cloud-backup
            # The AWS SDK is a large tree, but `put_object`'s
            # request-construction logic (bucket/key, the custom-endpoint
            # override, region, and the SDK-error-to-string mapping) is
            # exercised here too, not just by clippy: none of it needs a
            # network call or a live S3-compatible server, only a client-side
            # `SdkError` and the pure `plan_put_object` helper.
            test: true
            clippy: true
          - feature: ann
            test: true
            clippy: false
          - feature: ocr
            test: false
            clippy: true
          - feature: audio
            test: false
            clippy: true
          - feature: rerank
            test: true
            clippy: false
          - feature: local-embed
            test: false
            clippy: true
          - feature: stack-dumps
            test: true
            clippy: true
            # The cost this feature carries and no other one here does:
            # `rstack-self` links libunwind's ptrace API, a *system* library.
            #
            # liblzma-dev is not optional, and its absence is not obvious.
            # libunwind-ptrace.so carries undefined lzma_* references; whether
            # they resolve depends on whether the local libunwind.so happens to
            # declare DT_NEEDED on liblzma, which differs between builds.
            # remind_me_core's build.rs asks for -llzma explicitly so it never
            # depends on that accident -- which means the dev package has to be
            # here. See docs/adr/0014.
            apt: libunwind-dev liblzma-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Keyed per feature: each feature set produces different dependency
      # artifacts, and one shared cache across all eight legs would have them
      # overwriting each other's entries every run.
      - name: Cache cargo registry and dependency build output
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.feature }}

      - name: Install system packages this feature needs
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: cargo test --features ${{ matrix.feature }}
        if: matrix.test
        run: cargo test -p remind_me_core --features ${{ matrix.feature }} --locked

      - name: cargo clippy --features ${{ matrix.feature }}
        if: matrix.clippy
        run: cargo clippy -p remind_me_core --features ${{ matrix.feature }} --all-targets --locked -- -D warnings

  # Every leg above enables exactly one optional feature at a time, so a
  # regression that only shows up when several are compiled *together* has
  # nothing here to catch it (#279). That gap matters most for `ocr`,
  # `rerank`, and `local-embed`: per their comments in
  # `crates/remind_me_core/Cargo.toml`, they deliberately share one `rten`/
  # `tokenizers` runtime instead of each pulling in its own, specifically so a
  # "full install" does not carry a second neural-network runtime. Nothing
  # before this job has ever compiled that combination, so a `rten` upgrade
  # that changes global state it keeps (its thread pool, say) could break the
  # combination invisibly -- every feature passes alone, but two
  # `rten::Model` loads sharing that state at once could race or panic.
  #
  # A separate job rather than more `check` steps, on purpose: `check`
  # already runs right up against the runner's disk building `local-embed`
  # last (see that step's comment), and this feature set links `rten` and
  # `tokenizers` into even more test binaries than `local-embed` does alone.
  # A fresh runner gives it a full disk instead of `check`'s leftovers.
  #
  # `ann`/`pdf` ride along too: the issue's "realistic full install" is what a
  # user who wants everything actually enables, and `pdf`/`ocr`/`audio` are
  # three parallel branches of the same `import_content` dispatch, so `pdf`
  # compiling alongside `ocr` here is worth the (cheap, pure-Rust) inclusion.
  # `audio` and `cloud-backup` are left out: neither shares any runtime with
  # `ocr`/`rerank`/`local-embed`, so they add compile time without covering
  # any new cross-feature interaction. `stack-dumps` is left out too -- it is
  # the one feature here with a *system*-library dependency
  # (`libunwind-dev`/`liblzma-dev`), off by default for exactly that reason
  # (see its own step and `docs/adr/0014`), and no combination above installs
  # or needs those packages, so this job does not either.
  #
  # This runs the actual test suite, not just clippy, unlike the `ocr`/
  # `local-embed` steps above: the whole point is to exercise
  # `ocr`/`rerank`/`local-embed` initializing and using `rten` in the same
  # process, which a compile-only check can never do.
  combined-features:
    name: build / test / clippy (combined features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and dependency build output
        uses: Swatinem/rust-cache@v2
        with:
          key: combined

      - name: cargo build --features ann,ocr,rerank,local-embed,pdf
        run: cargo build -p remind_me_core --features ann,ocr,rerank,local-embed,pdf --locked

      - name: cargo test --features ann,ocr,rerank,local-embed,pdf
        run: cargo test -p remind_me_core --features ann,ocr,rerank,local-embed,pdf --locked

      - name: cargo clippy --features ann,ocr,rerank,local-embed,pdf
        run: cargo clippy -p remind_me_core --features ann,ocr,rerank,local-embed,pdf --all-targets --locked -- -D warnings

  # A separate job, not more steps on `check`, because it needs a Postgres
  # service container and the rest of the workspace does not. Keeping it apart
  # means the main gate is not held up by a database that takes seconds to
  # become healthy, and a Postgres outage cannot red-X the whole workspace.
  hub:
    name: hub (sqlite + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hubtest
        ports:
          - 5432:5432
        # Without this the job races the database's startup; `pg_isready`
        # gates on the server actually accepting connections, not just the
        # container existing.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo registry and dependency build output
        uses: Swatinem/rust-cache@v2
        with:
          key: hub

      - name: cargo clippy -p remind_me_hub
        run: cargo clippy -p remind_me_hub --all-targets --locked -- -D warnings

      # No DATABASE_URL: the Postgres tests skip themselves, which is the path
      # a contributor without a database takes. Running it here proves that
      # path stays green rather than only ever being claimed.
      - name: cargo test -p remind_me_hub (sqlite only)
        run: cargo test -p remind_me_hub --locked

      # The run that matters: the legacy-schema migration and the
      # both-backends-agree differential only execute with a real server.
      - name: cargo test -p remind_me_hub (with postgres)
        env:
          REMIND_ME_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hubtest
          # A skipped Postgres test reports as *passed* and cargo hides the
          # SKIP line, so losing the service container here would look
          # identical to a clean run. This makes that a hard failure instead.
          REMIND_ME_HUB_REQUIRE_POSTGRES: "1"
        run: cargo test -p remind_me_hub --locked -- --test-threads=1

      # The SQLite-only build must keep working: it is what a self-hosted hub
      # that wants no Postgres driver actually compiles, and a `postgres::`
      # reference leaking outside the feature gate would only show up here.
      - name: cargo test -p remind_me_hub --no-default-features
        run: cargo test -p remind_me_hub --no-default-features --locked

  # `remind_me_core` has real Win32 FFI (`sidecars.rs`'s job-object teardown,
  # `export.rs`'s `\\?\`-prefix stripping — see `Cargo.toml`'s
  # `[target.'cfg(windows)'.dependencies]`), which every job above compiles
  # exactly zero lines of: `cfg(windows)` is false on every `ubuntu-latest`
  # runner in this file. A mistake in that code — even one as basic as a
  # syntax error — could sit unnoticed indefinitely.
  #
  # Scoped to the default build rather than mirroring `check`'s whole feature
  # matrix: the platform-specific risk lives in the unconditional `windows-sys`
  # dependency, not in any of the optional features, and several of those
  # (`stack-dumps`'s `rstack-self` ptrace backend, the `libunwind`/`liblzma`
  # apt packages) are Linux-only by design and would not even build here.
  windows:
    name: build / test / clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # `windows` needs no distinct key beyond this: the action already keys on
      # the runner OS, so it cannot collide with the Linux jobs above.
      - name: Cache cargo registry and dependency build output
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
