name: Release

# A push to `main` that moves the six crates' `[package].version` (kept in
# lockstep by scripts/get_workspace_version.sh) past the newest `vX.Y.Z` tag
# builds the CLI/hub binaries and the Claude Code plugin archive and publishes
# them as a GitHub Release with that tag. This is rusty_mill's
# remind-me-release.yml from while the product lived there, back at a
# repository root: bare `vX.Y.Z` tags again, and "Latest" set again.
#
# One workflow rather than "tag on bump" + "build on tag": a tag pushed with
# the default GITHUB_TOKEN triggers no other workflow, so a two-workflow split
# would silently never build anything. softprops/action-gh-release creates the
# tag itself, in the same run that detected the bump.

on:
  push:
    branches: [main]
    paths:
      - "crates/*/Cargo.toml"
  workflow_dispatch:

concurrency:
  group: remind-me-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The Rust toolchain every job builds with (except the MSRV check, which
  # pins its own). Pinned rather than `stable`: Rust 1.99 deprecated
  # `fetch_update` and added the default `clippy::assert_is_empty` lint
  # (~1,300 hits), so a stable bump broke every warnings-as-errors job at
  # once. Moving to a newer Rust is now a deliberate change here.
  RUST_TOOLCHAIN: "1.98.1"
  PRODUCT_DIR: "."
  TAG_PREFIX: v

jobs:
  detect-version:
    name: detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, not just this branch's history -- the existing-tag
          # check below needs every release ever published.
          fetch-depth: 0

      - id: version
        name: Read the crates' version and check for an existing release tag
        run: |
          set -euo pipefail
          version="$("$PRODUCT_DIR/scripts/get_workspace_version.sh")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG_PREFIX}${version}" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "${TAG_PREFIX}${version} is already tagged -- nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "${TAG_PREFIX}${version} is new -- will build and publish a release."
          fi

  # One native build per platform, no cross-compilation (see the original
  # workflow). `macos-15` replaced `macos-14`, unsupported from 2026-11-02;
  # both Apple targets build on the one arm64 image.
  build:
    name: build (${{ matrix.target }})
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: remind-me-release-${{ matrix.target }}

      # Default features only, matching what README tells a from-source user
      # to build. `-p` keeps this to the shipped binaries. remind_me_hub builds two: the hub,
      # and rusty-remind-me-hub-copy, which moves a SQLite or Postgres hub onto
      # the embedded engine (docs/adr/0021).
      - name: Build rusty-remind-me, rusty-remind-me-hub and the hub copy tool (release)
        run: cargo build --release --locked --target ${{ matrix.target }} -p rusty-remind-me -p remind_me_hub

      - name: Package the archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect-version.outputs.version }}"
          stage="rusty-remind-me-v${version}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/rusty-remind-me" "$stage/"
          cp "target/${{ matrix.target }}/release/rusty-remind-me-hub" "$stage/"
          cp "target/${{ matrix.target }}/release/rusty-remind-me-hub-copy" "$stage/"
          cp "$PRODUCT_DIR/README.md" "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          echo "ASSET_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $stage = "rusty-remind-me-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rusty-remind-me.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/rusty-remind-me-hub.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/rusty-remind-me-hub-copy.exe" "$stage/"
          Copy-Item "$env:PRODUCT_DIR/README.md" "$stage/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "ASSET_PATH=$stage.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  # The Claude Code plugin surface, zipped so it can be grabbed from the
  # Release page without cloning. Needs no Rust toolchain.
  package-plugin:
    name: package Claude Code plugin
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ci.yml's remind-me-plugin-version job should already have blocked a drifted PR, but a
      # release must never ship a plugin archive claiming the wrong version.
      - name: Verify plugin.json version matches this release
        run: '"$PRODUCT_DIR/scripts/check_plugin_version.sh"'

      - name: Build the plugin archive
        run: |
          set -euo pipefail
          version="${{ needs.detect-version.outputs.version }}"
          stage="rusty-remind-me-plugin-v${version}"
          mkdir "$stage"
          (cd "$PRODUCT_DIR" && cp -R .claude-plugin commands hooks .mcp.json README.md "$GITHUB_WORKSPACE/$stage/")
          zip -rq "${stage}.zip" "$stage"
          echo "ASSET_PATH=${stage}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-plugin
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [detect-version, build, package-plugin]
    if: needs.detect-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-asset-*
          merge-multiple: true

      # The body links RELEASE_NOTES.md rather than generated notes, which
      # would list the monorepo-era merge commits in the first release.
      - name: Create the release and attach all archives
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_PREFIX }}${{ needs.detect-version.outputs.version }}
          name: rusty_remind_me v${{ needs.detect-version.outputs.version }}
          body: >-
            rusty_remind_me v${{ needs.detect-version.outputs.version }}.
            What changed is in
            [RELEASE_NOTES.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/RELEASE_NOTES.md).
          make_latest: true
          files: dist/*
