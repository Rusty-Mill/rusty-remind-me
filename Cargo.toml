# rusty-remind-me: one workspace, six crates.
#
# Monorepo crates come from Rusty-Mill/rusty_mill as git dependencies pinned to
# one libs-* tag (rusty_mill ADR-0013). Bump every entry together: change the
# tag below, run `cargo update`, open a PR and let CI decide.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
remind_me_api = { path = "crates/remind_me_api" }
remind_me_core = { path = "crates/remind_me_core" }
remind_me_mcp = { path = "crates/remind_me_mcp" }
remind_me_remote = { path = "crates/remind_me_remote" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

rusty_atomic_file = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_axum = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_crypto_key = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_hex = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_json = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_mcp_server = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_multimodal_db_engine = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_oauth = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_oauth_server = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_percent = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }
rusty_tokio = { git = "https://github.com/Rusty-Mill/rusty_mill", rev = "eff5a5dd6da2dea52d5e78964d4ea53a80498508" }

# Patches do not carry through git dependencies, so the monorepo's are copied here.
[patch.crates-io]
aws-sigv4 = { path = "vendor/aws-sigv4" }
