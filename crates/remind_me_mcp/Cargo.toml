[package]
name = "remind_me_mcp"
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
remind_me_core.workspace = true

serde_json = "1.0"

[dev-dependencies]
# `json!` for the OAuth state store's `rusty_json` values in tests.
rusty_json = { workspace = true }
