[package]
name = "remind_me_remote"
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
remind_me_core.workspace = true
remind_me_mcp.workspace = true
rmcp = { version = "3.0.1", default-features = false, features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha256 = "1.5"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
