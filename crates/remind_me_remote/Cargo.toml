[package]
name = "remind_me_remote"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_percent = { workspace = true }
rusty_hex = { workspace = true }
rusty_base64 = { workspace = true }
rusty_oauth = { workspace = true }
async-trait = { workspace = true }
axum = "0.8"
futures = { workspace = true }
remind_me_core.workspace = true
remind_me_mcp.workspace = true
rusty_mcp_server = { workspace = true, features = ["http"] }
rusty_mcp_axum = { workspace = true }
thiserror = "2"

serde = { workspace = true }
serde_json = "1.0"
sha256 = "1.5"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
