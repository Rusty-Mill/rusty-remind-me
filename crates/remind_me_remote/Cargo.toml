[package]
name = "remind_me_remote"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
rusty_oauth = { workspace = true }
rusty_oauth_server = { workspace = true }
rusty_crypto_key = { workspace = true }
remind_me_core.workspace = true
remind_me_mcp.workspace = true
rusty_axum = { workspace = true }
rusty_mcp_server = { workspace = true, features = ["http", "rusty-axum"] }
rusty_tokio = { workspace = true }
thiserror = "2"

serde_json = "1.0"

[dev-dependencies]
# The tests' HTTP client (reqwest) runs on tokio; the server under test runs
# on its own rusty_tokio runtime.
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
