# fly.toml — Remind Me sync hub, deployed as a Fly.io app on the embedded
# engine: the data directory lives on a Fly Volume mounted at /data.
#
# Quick start (run from the MONOREPO ROOT, six levels up from this file —
# the Containerfile's context must be the workspace, since the hub is one
# crate in it and the build needs the root Cargo.toml and Cargo.lock. This is
# the one place the Rust hub's packaging differs materially from the Python
# hub's, whose context was `hub/` alone):
#
#   fly apps create remind-me-hub
#   fly volumes create remind_me_hub_data --size 1 -a remind-me-hub
#   fly secrets set SYNC_SECRET=$(openssl rand -hex 32) -a remind-me-hub
#   fly deploy --config crates/apps/rusty_remind_me/crates/remind_me_hub/deploy/fly.toml \
#              --dockerfile crates/apps/rusty_remind_me/crates/remind_me_hub/Containerfile
#
# A Fly Volume is pinned to one machine, so the app runs as a single instance
# and a host failure takes the hub offline until it returns. The hub cannot
# share its data directory between machines, so do not scale it past one.
#
# Moving off the Fly Postgres this template used to attach: stop the hub
# (`fly scale count 0`), create the volume, then from a one-off machine with
# the volume mounted and the old DATABASE_URL secret still set, run
#   rusty-remind-me-hub-copy --from-postgres --to /data/hub
# and finally `fly secrets unset DATABASE_URL` and redeploy. The hub refuses
# to start while DATABASE_URL is set, so it never comes up empty in front of
# data that was not copied. See the crate README's "Moving a hub onto the
# engine".
#
# No [[services]]/http_service block below on purpose: the hub is reached over
# Fly's private 6PN network (WireGuard peer, or a Tailscale-to-Fly bridge) at
# remind-me-hub.internal:8765, not the public internet — same "SYNC_SECRET is
# the only thing standing between the internet and your memory database, so
# don't expose this publicly" posture as the quadlet and compose templates.
# Add your own [[services]] block only if you specifically want a public HTTPS
# endpoint, and put real TLS + rate limiting in front of it if you do.

app = "remind-me-hub"
primary_region = "iad" # change to your nearest Fly region

[build]
  dockerfile = "crates/apps/rusty_remind_me/crates/remind_me_hub/Containerfile"

[env]
  REMIND_ME_HUB_DATA_DIR = "/data/hub"

[mounts]
  source = "remind_me_hub_data"
  destination = "/data"

[[vm]]
  # The engine holds every record in memory: raise this as the hub grows.
  size = "shared-cpu-1x"
  memory = "256mb"

# Check health from a WireGuard peer (`fly wireguard create`, or the
# Tailscale-to-Fly bridge) since there's no public endpoint here:
#   curl http://remind-me-hub.internal:8765/health
# `fly status`/`fly machine status` also report whether the Machine itself is
# running, independent of application-level health.
