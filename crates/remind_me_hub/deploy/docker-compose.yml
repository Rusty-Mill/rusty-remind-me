# docker-compose.yml — Remind Me sync hub on the embedded engine.
#
# One container, a data directory, no database server (docs/adr/0021). The
# hub keeps every record in memory and logs each write to the volume before
# answering. The same image and hub.env contract as the Podman Quadlet
# (remind-me-hub.container), for environments that prefer Compose.
#
# Taking over an existing hub, or moving this file's deployment off the
# Postgres it used to run? Copy the data onto the engine first with
# rusty-remind-me-hub-copy, which ships in this image (see the crate README's
# "Moving a hub onto the engine"); pointing this file at an empty volume
# starts an empty hub.
#
# Quick start (from this directory):
#   cp hub.env.example hub.env
#   # openssl rand -hex 32   -> SYNC_SECRET (hub.env)
#   docker compose up -d
#   curl http://127.0.0.1:8765/health
#
# The hub binds 127.0.0.1:8765 ONLY, same as the quadlet default — reach it
# over an SSH tunnel or Tailscale, never expose it directly to the public
# internet (SYNC_SECRET is the only thing standing between the internet and
# your memory database). Widen the `ports:` mapping below only if you
# understand and accept that exposure.

services:
  remind-me-hub:
    build:
      # The monorepo root, six levels up: the hub is one crate in a Cargo
      # workspace, so the build needs the workspace Cargo.toml and Cargo.lock.
      context: ../../../../../..
      dockerfile: crates/apps/rusty_remind_me/crates/remind_me_hub/Containerfile
    restart: always
    env_file: hub.env
    volumes:
      # The image runs as uid 10001 (user `hub`), so a named volume is used
      # rather than a bind mount: Docker initialises a named volume with the
      # image path's ownership, whereas a host bind mount arrives owned by the
      # host user and leaves the hub unable to create its data. If you do
      # bind-mount a host directory, `chown 10001:10001` it first.
      - hub-data:/data
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      # The binary is the only thing in the image — no curl, no wget — so the
      # check is the hub asking itself. `/health` answers unauthenticated by
      # design, which is what makes this possible without baking the secret
      # into the healthcheck.
      test: ["CMD", "rusty-remind-me-hub", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub-data:
