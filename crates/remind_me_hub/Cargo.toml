[package]
name = "remind_me_hub"
version = "0.2.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# The copy tool's SQLite reader (`src/import/sqlite.rs`), which opens an old
# hub's database read-only. The hub itself no longer stores anything in
# SQLite.
rusqlite = { version = "0.39", features = ["bundled"] }

# The copy tool's Postgres reader (`src/import/postgres.rs`). `with-serde_json-1`
# is what lets a row read as `to_jsonb(row)` arrive as a `serde_json::Value`.
postgres = { version = "0.19", features = [
    "with-serde_json-1",
], optional = true }

# The store (docs/adr/0021): `rusty_multimodal_db`'s storage engine,
# in-process. `uuid` with `v5` derives each record's engine id from its
# string id; the engine itself only needs `Uuid` as a type.
rusty_multimodal_db_engine = { workspace = true }
uuid = { version = "1", features = ["v5"] }

[features]
default = ["postgres-import"]
# The copy tool's Postgres reader. It outlives the Postgres store
# (docs/adr/0021, decision 6): a hub still on Postgres can be copied onto the
# engine with any later release.
postgres-import = ["dep:postgres"]

[dev-dependencies]
# The copy tests load a recorded Postgres hub into a test database.
postgres = { version = "0.19", features = ["with-serde_json-1"] }

[[bin]]
name = "rusty-remind-me-hub"
path = "src/main.rs"

# Copies a SQLite or Postgres hub into an embedded-engine data directory,
# keeping every hub_seq (docs/adr/0021, phase 3).
[[bin]]
name = "rusty-remind-me-hub-copy"
path = "src/bin/copy.rs"

# Pull latency under push load (docs/adr/0021).
[[example]]
name = "pull_latency"
