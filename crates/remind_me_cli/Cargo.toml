[package]
name = "rusty-remind-me"
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rusty-Mill/rusty_mill"

[package.metadata.rusty_mill]
layer = "apps"

[dependencies]
remind_me_core.workspace = true
remind_me_mcp.workspace = true
remind_me_api.workspace = true
remind_me_remote.workspace = true

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
